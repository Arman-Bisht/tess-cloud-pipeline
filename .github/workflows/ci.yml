name: Astrohunter Pro CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify cross-platform requirements-lock.txt resolution on Linux & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements-lock.txt
          pip install -r requirements.txt

      - name: Run Plumbing, Watchdog, Centroid, Benchmark, Lockfile, Network & README Hygiene Tests (20 tests)
        run: python test_vetter_plumbing.py

      - name: Verify README Tables and Under-10k Character Limit (WP1)
        run: python scripts/make_readme_tables.py --check

      - name: Run Downloader Chronological Sorting & Deduplication Regression Test
        run: python test_downloader_sorting.py

      - name: Run Offline TPF Difference-Image 95th-Percentile Calibration Verification (Read-Only)
        run: python calibrate_tpf_threshold.py --offline

      - name: Validate CITATION.cff, .zenodo.json, and Release Metadata
        run: |
          python -c "
          import json, yaml, re, pathlib, os
          from test_vetter_plumbing import check_citation_and_zenodo_placeholders
          ref = os.getenv('GITHUB_REF', 'main')
          check_citation_and_zenodo_placeholders(ref)

          base = pathlib.Path('.')
          cff = yaml.safe_load((base / 'CITATION.cff').read_text(encoding='utf-8'))
          assert cff.get('cff-version') == '1.2.0', 'Invalid cff-version'
          assert cff.get('license') == 'MIT', 'Invalid license in CITATION.cff'
          assert cff.get('title'), 'Missing title in CITATION.cff'
          assert len(cff.get('authors', [])) > 0, 'No authors in CITATION.cff'
          orcid = cff['authors'][0].get('orcid', '')
          assert re.match(r'^https://orcid\.org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$', orcid), f'Invalid ORCID format: {orcid}'

          zen = json.loads((base / '.zenodo.json').read_text(encoding='utf-8'))
          assert zen.get('upload_type') == 'software', 'Invalid upload_type in .zenodo.json'
          assert zen.get('license') == 'MIT', 'Invalid license in .zenodo.json'
          assert len(zen.get('creators', [])) > 0, 'Missing creators in .zenodo.json'

          lic = (base / 'LICENSE').read_text(encoding='utf-8')
          assert 'MIT License' in lic, 'LICENSE must be MIT'
          print('CI validated CITATION.cff, .zenodo.json, and LICENSE successfully.')
          "

      - name: Verify Master Catalog Schema, 50-Target Benchmark Results & Lockfile Integrity
        run: |
          python -c "
          import os, pandas as pd
          from injection_recovery import verify_external_benchmark_results
          assert os.path.exists('requirements-lock.txt'), 'Missing transitive requirements-lock.txt'
          assert os.path.exists('fetch_benchmark_data.py'), 'Missing fetch_benchmark_data.py'
          vres = verify_external_benchmark_results()
          assert vres['n_total'] == 50 and vres['n_planets'] == 28 and vres['n_non_planets'] == 22
          df = pd.read_csv('master_discoveries.csv')
          assert len(df) == 34, f'Expected 34 rows, got {len(df)}'
          assert 'centroid_offset_px' in df.columns, 'Missing centroid_offset_px column'
          assert (df['pipeline_version'] == 'v2.7.0').all(), 'All rows must carry v2.7.0'
          tier_a = df[df['confidence'].str.startswith('Tier A')]['name'].tolist()
          assert set(tier_a) == {'HD 10528', 'HD 10635', 'HD 10653', 'HD 10720'}, f'Unexpected Tier A rows: {tier_a}'
          print(f'Catalog & benchmark integrity check passed: 34 rows, v2.7.0, 50 external benchmark targets (TP={vres[\"tp\"]}/28, TN={vres[\"tn\"]}/22)')
          "


